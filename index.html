  <script>
(function() {
  function sendHeight() {
    var docEl = document.documentElement;
    var body  = document.body;
    if (!body) return;
    var prevDocH    = docEl.style.height;
    var prevDocMinH = docEl.style.minHeight;
    var prevBodyH    = body.style.height;
    var prevBodyMinH = body.style.minHeight;
    docEl.style.height = '0px';
    docEl.style.minHeight = '0px';
    body.style.height  = '0px';
    body.style.minHeight = '0px';
    // Use body.scrollHeight only — documentElement.scrollHeight is
    // viewport-biased and always returns at least the iframe viewport
    // height (so short sections in a tall iframe report wrong values).
    var raw = body.scrollHeight;
    docEl.style.height = prevDocH;
    docEl.style.minHeight = prevDocMinH;
    body.style.height  = prevBodyH;
    body.style.minHeight = prevBodyMinH;
    var height = Math.min(raw, 20000);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'iframeHeight', height: height, id: window.location.pathname }, '*');
    }
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  if (document.body) {
    new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true });
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(sendHeight).observe(document.body);
    }
  }
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'requestHeight') sendHeight();
  });
})();
